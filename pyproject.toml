[project]
name = "wzry-ai-model"
version = "0.1.0"
description = "A PyTorch multimodal Transformer model for an AI agent playing Honor of Kings."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -ra --tb=short"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s:%(lineno)d %(message)s"
markers = [
    "cpu: run tests on CPU",
    "gpu: run tests on CUDA GPU",
]
